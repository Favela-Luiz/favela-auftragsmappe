<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAVELA INDUSTRIES | Digital Job Management System</title>

  <!-- jsPDF 4.2.1 & jsPDF-AutoTable 5.0.9 (UMD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/5.0.9/jspdf.plugin.autotable.min.js"></script>
  <!-- Google Identity Services für Google Calendar OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-panel: #12151c;
      --bg-card: #181c26;
      --bg-input: #0f1218;
      --bg-hover: #212634;
      --border: #2a3040;
      --border-light: #363e52;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-red: #e11d48;
      --accent-red-hover: #be123c;
      --accent-blue: #0ea5e9;
      --accent-blue-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 8px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-base); color: var(--text-main); font-family: var(--font); font-size: 14px; line-height: 1.5; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }

    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 270px; background: var(--bg-panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
      transition: transform 0.25s ease;
    }
    .main-area { flex: 1; margin-left: 270px; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: rgba(18, 21, 28, 0.92); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      position: sticky; top: 0; z-index: 30;
    }
    .content-wrap { padding: 24px; max-width: 1560px; width: 100%; margin: 0 auto; }

    .brand-box {
      padding: 18px 16px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      background: linear-gradient(135deg, rgba(225,29,72,0.08), rgba(14,165,233,0.08));
    }
    .logo-frame {
      width: 100%; max-width: 190px; height: 92px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px; position: relative;
    }
    .logo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .brand-title { font-weight: 800; font-size: 15px; letter-spacing: 1.5px; color: #fff; }
    .brand-sub {
      font-size: 10px; letter-spacing: 1.8px; font-weight: 600; margin-top: 2px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .nav-list { padding: 14px 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 14px;
      background: transparent; border: 1px solid transparent; border-radius: var(--radius);
      color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; text-align: left;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-btn.active {
      background: linear-gradient(90deg, rgba(225,29,72,0.16), rgba(14,165,233,0.12));
      border-color: var(--border-light); color: #fff; font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent-red);
    }
    .sidebar-footer { padding: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }

    .mobile-menu-btn { display: none; background: var(--bg-card); border: 1px solid var(--border); color: #fff; padding: 8px 12px; border-radius: var(--radius); cursor: pointer; }
    .search-global { flex: 1; max-width: 420px; position: relative; }
    .search-global input { width: 100%; padding-left: 34px; }
    .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .role-pill {
      display: flex; align-items: center; gap: 8px; background: var(--bg-card);
      border: 1px solid var(--border); padding: 5px 10px; border-radius: var(--radius);
    }
    .role-pill select { border: none; background: transparent; padding: 2px 4px; font-weight: 600; width: auto; }
    .timer-pill {
      display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: var(--radius);
      background: rgba(225,29,72,0.16); border: 1px solid var(--accent-red); color: #fff; font-size: 12px; font-weight: 600;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 15px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-main); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease; text-decoration: none; white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-light); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-red-hover); border-color: var(--accent-red-hover); }
    .btn-blue { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .btn-blue:hover:not(:disabled) { background: var(--accent-blue-hover); border-color: var(--accent-blue-hover); }
    .btn-success { background: var(--success); border-color: var(--success); color: #052e16; }
    .btn-warning { background: var(--warning); border-color: var(--warning); color: #1c1917; }
    .btn-danger { background: rgba(239,68,68,0.15); border-color: var(--danger); color: #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 12px; }
    .btn-lg { padding: 12px 20px; font-size: 14px; }

    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .card-title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .accent-bar-red { border-top: 3px solid var(--accent-red); }
    .accent-bar-blue { border-top: 3px solid var(--accent-blue); }

    .grid { display: grid; gap: 16px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .kpi-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 15px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
    }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent-red), var(--accent-blue)); }
    .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .kpi-value { font-size: 23px; font-weight: 800; color: #fff; }
    .kpi-sub { font-size: 11px; color: var(--text-dim); }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .form-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .req { color: var(--accent-red); }
    input, select, textarea {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text-main); padding: 9px 11px; border-radius: 6px; font-size: 13px; font-family: inherit;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-blue); }
    input[readonly], input:disabled { opacity: 0.7; background: #0c0e13; }
    textarea { min-height: 76px; resize: vertical; }

    .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
    .check-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .check-item:hover { border-color: var(--border-light); }
    .check-item input[type="checkbox"] { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--accent-blue); cursor: pointer; flex-shrink: 0; }
    .check-item.checked { border-color: rgba(16,185,129,0.5); background: rgba(16,185,129,0.06); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { background: #0f131b; color: var(--text-muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; white-space: nowrap; border: 1px solid transparent;
    }
    .st-Anfrage { background: rgba(148,163,184,0.15); color: #cbd5e1; border-color: rgba(148,163,184,0.3); }
    .st-Angebot { background: rgba(14,165,233,0.15); color: #7dd3fc; border-color: rgba(14,165,233,0.35); }
    .st-Bestätigt { background: rgba(59,130,246,0.2); color: #93c5fd; border-color: rgba(59,130,246,0.4); }
    .st-Geplant { background: rgba(168,85,247,0.18); color: #d8b4fe; border-color: rgba(168,85,247,0.35); }
    .st-Angenommen { background: rgba(245,158,11,0.18); color: #fcd34d; border-color: rgba(245,158,11,0.4); }
    .st-Bearbeitung { background: rgba(225,29,72,0.2); color: #fda4af; border-color: rgba(225,29,72,0.45); }
    .st-QK { background: rgba(249,115,22,0.2); color: #fdba74; border-color: rgba(249,115,22,0.45); }
    .st-Abholbereit { background: rgba(16,185,129,0.2); color: #6ee7b7; border-color: rgba(16,185,129,0.45); }
    .st-Übergeben { background: rgba(20,184,166,0.2); color: #5eead4; border-color: rgba(20,184,166,0.45); }
    .st-Abgeschlossen { background: rgba(34,197,94,0.22); color: #86efac; border-color: rgba(34,197,94,0.5); }
    .st-Storniert { background: rgba(239,68,68,0.18); color: #fca5a5; border-color: rgba(239,68,68,0.4); }

    .tabs-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
    .tab-btn {
      padding: 9px 14px; border-radius: var(--radius); background: var(--bg-panel); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn:hover { color: #fff; background: var(--bg-hover); }
    .tab-btn.active { background: linear-gradient(90deg, var(--accent-red), var(--accent-blue)); border-color: transparent; color: #fff; }

    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 12px; }
    .photo-card {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .photo-card img { width: 100%; height: 130px; object-fit: cover; cursor: pointer; }
    .photo-meta { padding: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .sig-pad-wrap { background: #fff; border-radius: 6px; border: 2px solid var(--border-light); overflow: hidden; touch-action: none; }
    .sig-canvas { width: 100%; height: 150px; display: block; cursor: crosshair; }
    .sketch-wrap { background: #0f131b; border: 1px solid var(--border-light); border-radius: 8px; overflow: hidden; text-align: center; }
    .sketch-canvas { max-width: 100%; height: auto; cursor: crosshair; display: block; margin: 0 auto; touch-action: none; }

    .alert { padding: 12px 14px; border-radius: var(--radius); border: 1px solid; font-size: 13px; margin-bottom: 14px; }
    .alert-info { background: rgba(14,165,233,0.1); border-color: rgba(14,165,233,0.35); color: #bae6fd; }
    .alert-warn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.35); color: #fde68a; }
    .alert-danger { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #fecaca; }
    .alert-success { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.4); color: #a7f3d0; }

    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
    .toast {
      padding: 12px 16px; border-radius: var(--radius); background: var(--bg-card); border: 1px solid var(--border-light);
      box-shadow: var(--shadow); color: #fff; font-size: 13px; font-weight: 500; border-left: 4px solid var(--accent-blue);
    }
    .toast.error { border-left-color: var(--accent-red); }
    .toast.success { border-left-color: var(--success); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius);
      max-width: 620px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: var(--shadow);
    }

    @media (max-width: 1024px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-area { margin-left: 0; }
      .mobile-menu-btn { display: inline-flex; }
      .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
      .topbar { padding: 10px 14px; }
      .content-wrap { padding: 14px; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <aside id="sidebar" class="sidebar">
    <div class="brand-box">
      <div class="logo-frame" id="logo-frame">
        <img id="company-logo-img" src="logo.png" alt="Favela Industries Logo" style="display:none;" />
        <div id="company-logo-fallback" style="text-align:center;">
          <svg width="160" height="78" viewBox="0 0 200 95" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e11d48"/>
                <stop offset="100%" stop-color="#0ea5e9"/>
              </linearGradient>
            </defs>
            <path d="M18 68 L18 44 L44 30 L64 38 L64 16 L100 6 L136 22 L136 32 L162 24 L182 42 L182 68 Z" fill="#090b0f" stroke="url(#fiGrad)" stroke-width="4" stroke-linejoin="round"/>
            <rect x="76" y="20" width="14" height="10" fill="#fff"/>
            <rect x="110" y="26" width="12" height="8" fill="#fff"/>
            <rect x="12" y="54" width="176" height="32" rx="4" fill="#090b0f" stroke="url(#fiGrad)" stroke-width="3.5"/>
            <text x="100" y="77" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="2">FAVELA</text>
          </svg>
        </div>
      </div>
      <div class="brand-title">FAVELA INDUSTRIES</div>
      <div class="brand-sub">VEHICLE WRAPPING &amp; DESIGN</div>
    </div>

    <nav class="nav-list">
      <button class="nav-btn active" data-view="dashboard" onclick="App.navigate('dashboard')">📊 Dashboard</button>
      <button class="nav-btn" data-view="orders" onclick="App.navigate('orders')">🚗 Auftragsverwaltung</button>
      <button class="nav-btn" data-view="new-order" onclick="App.navigate('new-order')">➕ Neuer Auftrag</button>
      <button class="nav-btn" data-view="tasks" onclick="App.navigate('tasks')">✅ Aufgaben &amp; Termine</button>
      <button class="nav-btn" data-view="settings" onclick="App.navigate('settings')">⚙️ Einstellungen &amp; Backup</button>
    </nav>

    <div class="sidebar-footer">
      <div id="sidebar-sync-info">Speicher: IndexedDB + LocalStorage</div>
      <div id="sidebar-gcal-info" style="margin-top:4px;">Kalender: Nicht verbunden</div>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:10px;flex:1;">
        <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menü</button>
        <div class="search-global">
          <span class="search-icon">🔍</span>
          <input type="text" id="global-search" placeholder="Auftrag, Kunde, Kennzeichen, FIN suchen..." oninput="App.handleGlobalSearch(this.value)" />
        </div>
      </div>

      <div class="topbar-actions">
        <div id="active-timer-pill" class="timer-pill" style="display:none;"></div>
        <div class="role-pill" title="Aktive Benutzerrolle und Mitarbeiter">
          <span style="font-size:12px;color:var(--text-muted);">Rolle:</span>
          <select id="active-role-select" onchange="App.changeRole(this.value)">
            <option value="Inhaber">Inhaber</option>
            <option value="Mitarbeiter">Mitarbeiter</option>
          </select>
          <select id="active-user-select" onchange="App.changeActiveUser(this.value)" style="border-left:1px solid var(--border);padding-left:8px;"></select>
        </div>
        <button class="btn btn-primary" onclick="App.navigate('new-order')">➕ Neuer Auftrag</button>
      </div>
    </header>

    <main id="app-view" class="content-wrap"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-container"></div>

<script>
const SCHEMAS = {
  STATUSES: [
    { key: 'Anfrage', cls: 'st-Anfrage' },
    { key: 'Angebot erstellt', cls: 'st-Angebot' },

    { key: 'In Bearbeitung', cls: 'st-Bearbeitung' },
    { key: 'Qualitätskontrolle', cls: 'st-QK' },

  INTAKE_CHECKS: [

    'Lackzustand kontrolliert',
    'Vorhandene Lackschäden dokumentiert',
    'Kratzer dokumentiert',

  ],
  QC_SECTIONS: [

      items: [

        'Keine Kratzer',

        'Keine sichtbaren Dehnungsverformungen',
        'Gleichmäßige Oberflächenstruktur',
        'Gleichmäßiger Glanzgrad'
      ]
    },
    {
      code: 'B', title: 'B. Kanten und Übergänge',
      items: [
        'Kanten sauber verarbeitet',
        'Kanten ausreichend umgelegt, soweit technisch möglich',
        'Keine offenen Folienkanten',
        'Keine sichtbaren Schnittfehler',

function escapeHtml(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function escapeAttr(val) {
  return escapeHtml(val);
}

function uid(prefix = 'id') {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
}

function formatEUR(num) {
  const n = Number(num) || 0;
  return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
}

function formatPDFEur(num) {
  const n = Number(num) || 0;
  return `${n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} EUR`;
}

function formatDateDE(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return String(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatTimeDE(dateOrStr) {
  if (!dateOrStr) return '-';
  if (/^\d{2}:\d{2}$/.test(dateOrStr)) return dateOrStr;
  const d = new Date(dateOrStr);
  if (isNaN(d.getTime())) return String(dateOrStr);
  return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function toLocalOffsetISO(dateStr, timeStr) {
  const cleanDate = dateStr || todayISO();
  const cleanTime = timeStr || '09:00';
  const localDate = new Date(`${cleanDate}T${cleanTime}:00`);
  if (isNaN(localDate.getTime())) return new Date().toISOString();
  const offsetMin = -localDate.getTimezoneOffset();
  const sign = offsetMin >= 0 ? '+' : '-';
  const absMin = Math.abs(offsetMin);
  const oh = String(Math.floor(absMin / 60)).padStart(2, '0');
  const om = String(absMin % 60).padStart(2, '0');
  return `${cleanDate}T${cleanTime}:00${sign}${oh}:${om}`;
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function nowTimeHHMM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function statusBadge(status) {

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function compressImageFile(file, maxWidth = 1600, quality = 0.82) {
  if (!file || !file.type.startsWith('image/')) return fileToDataURL(file);
  const rawUrl = await fileToDataURL(file);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(rawUrl);
    img.src = rawUrl;
  });
}

const StorageService = {
  DB_NAME: 'FavelaIndustriesDB',
  DB_VERSION: 1,
  SETTINGS_KEY: 'fi_settings_v1',
  TIMER_KEY: 'fi_active_timer_v1',
  db: null,

  defaultSettings() {
    return {
      role: 'Inhaber',
      activeUser: 'Inhaber (Chef)',
      employees: [
        { name: 'Inhaber (Chef)', role: 'Inhaber' },
        { name: 'Mitarbeiter 1', role: 'Mitarbeiter' },
        { name: 'Mitarbeiter 2', role: 'Mitarbeiter' }
      ],
      defaultVat: 19,
      hourlyRate: 85,
      geminiApiKey: '',
      googleClientId: '',
      selectedCalendarId: 'primary',
      logoDataUrl: ''
    };
  },

  getSettings() {
    try {
      const raw = localStorage.getItem(this.SETTINGS_KEY);
      if (!raw) return this.defaultSettings();
      return { ...this.defaultSettings(), ...JSON.parse(raw) };
    } catch {
      return this.defaultSettings();
    }
  },

  saveSettings(settings) {
    localStorage.setItem(this.SETTINGS_KEY, JSON.stringify(settings));
  },

  async init() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('orders')) {
          db.createObjectStore('orders', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('tasks')) {
          db.createObjectStore('tasks', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => { this.db = e.target.result; resolve(); };
      req.onerror = (e) => reject(e.target.error);
    });
  },

  async getAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  async put(storeName, item) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).put(item);
      req.onsuccess = () => resolve(item);
      req.onerror = () => reject(req.error);
    });
  },

  async remove(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },

  async clearStore(storeName) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).clear();
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  },

  async exportJSON(includeSecrets = false) {
    const orders = await this.getAll('orders');
    const tasks = await this.getAll('tasks');
    const settings = { ...this.getSettings() };
    if (!includeSecrets) {
      settings.geminiApiKey = '';
    }
    return JSON.stringify({
      app: 'FAVELA INDUSTRIES DJMS',
      exportedAt: new Date().toISOString(),
      version: 1,
      orders,
      tasks,
      settings
    }, null, 2);
  },

  async importJSON(jsonText) {
    const data = JSON.parse(jsonText);
    if (!Array.isArray(data.orders)) throw new Error('Ungültiges Backup-Format (orders fehlt).');
    await this.clearStore('orders');
    await this.clearStore('tasks');
    for (const o of data.orders) await this.put('orders', o);
    if (Array.isArray(data.tasks)) {
      for (const t of data.tasks) await this.put('tasks', t);
    }
    if (data.settings) {
      const cur = this.getSettings();
      const merged = { ...cur, ...data.settings };
      if (!data.settings.geminiApiKey && cur.geminiApiKey) {
        merged.geminiApiKey = cur.geminiApiKey;
      }
      this.saveSettings(merged);
    }
  }
};

function calcOrderMetrics(order) {
  const settings = StorageService.getSettings();
  const netPrice = Number(order.job?.netPrice) || 0;
  const vatRate = Number(order.job?.vatRate) || 0;
  const grossPrice = netPrice * (1 + vatRate / 100);

  let totalMaterialCost = 0;
  let totalLengthM = 0;
  let totalAreaM2 = 0;
  (order.materials || []).forEach(m => {
    totalMaterialCost += Number(m.totalCost) || 0;
    totalLengthM += Number(m.lengthM) || 0;
    totalAreaM2 += Number(m.areaM2) || 0;
  });

  const materialQuotePct = netPrice > 0 ? (totalMaterialCost / netPrice) * 100 : 0;
  const dbAfterMaterial = netPrice - totalMaterialCost;

  let totalHours = 0;
  const hoursByEmployee = {};
  const hoursByActivity = {};
  (order.timeLogs || []).forEach(t => {
    const h = Number(t.effectiveHours) || 0;
    totalHours += h;
    const emp = t.employee || 'Unbekannt';
    const act = t.activity || 'Sonstiges';
    hoursByEmployee[emp] = (hoursByEmployee[emp] || 0) + h;
    hoursByActivity[act] = (hoursByActivity[act] || 0) + h;
  });

  const plannedHours = Number(order.job?.plannedHours) || 0;
  const hoursDeviation = totalHours - plannedHours;

  const hourlyRate = order.hourlyRateOverride !== null && order.hourlyRateOverride !== ''
    ? Number(order.hourlyRateOverride)
    : (Number(settings.hourlyRate) || 85);

  const laborCost = totalHours * hourlyRate;
  const otherDirect = Number(order.otherDirectCosts) || 0;
  const contributionMargin = netPrice - totalMaterialCost - laborCost - otherDirect;

  return {
    netPrice, vatRate, grossPrice,
    totalMaterialCost, totalLengthM, totalAreaM2, materialQuotePct, dbAfterMaterial,
    totalHours, plannedHours, hoursDeviation, hoursByEmployee, hoursByActivity,
    hourlyRate, laborCost, otherDirect, contributionMargin
  };
}

const GeminiOCRService = {
  async extractVehicleData(file) {
    const settings = StorageService.getSettings();
    if (!settings.geminiApiKey) {
      throw new Error('Bitte hinterlegen Sie zuerst Ihren Gemini API-Key unter Einstellungen.');
    }
    const dataUrl = await fileToDataURL(file);
    const base64Data = dataUrl.split(',')[1];
    const mimeType = file.type || (file.name.toLowerCase().endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');

    const promptText = `Analysiere diese deutsche Zulassungsbescheinigung Teil I (Fahrzeugschein).
Extrahiere ausschließlich die tatsächlich lesbaren Angaben in ein valides JSON-Objekt.
WICHTIGE REGELN:
- Erfinde NIEMALS Daten.
- Wenn ein Feld nicht eindeutig lesbar oder nicht vorhanden ist, gib exakt den String "unbekannt" zurück.
- Gib ausschließlich JSON zurück mit diesen Schlüsseln:
{
  "B": "Erstzulassung (TT.MM.JJJJ)",
  "D1": "Marke / Hersteller (Feld D.1)",
  "D2": "Typ / Variante / Version (Feld D.2)",
  "D3": "Handelsbezeichnung (Feld D.3)",
  "E": "Fahrzeug-Identifizierungsnummer FIN (Feld E)",
  "hsn": "Herstellerschlüsselnummer (Feld 2.1)",
  "tsn": "Typschlüsselnummer (Feld 2.2)",
  "P1": "Hubraum in ccm (Feld P.1)",
  "P2": "Nennleistung in kW (Feld P.2)",
  "P3": "Kraftstoffart / Energiequelle (Feld P.3)",
  "J": "Fahrzeugklasse (Feld J)",
  "K": "EG-Typgenehmigung (Feld K)",
  "color": "Farbe des Fahrzeugs (Feld R falls vorhanden)",
  "plate": "Amtliches Kennzeichen (falls vorhanden)"
}`;

    const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': settings.geminiApiKey.trim()
      },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: promptText },
            { inline_data: { mime_type: mimeType, data: base64Data } }
          ]
        }],
        generationConfig: {
          temperature: 0.1,
          responseMimeType: 'application/json'
        }
      })
    });

    if (!response.ok) {
      const errBody = await response.text();
      throw new Error(`Gemini API Fehler (${response.status}): ${errBody.slice(0, 220)}`);
    }

    const result = await response.json();
    const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!rawText) throw new Error('Keine Antwort von der Gemini API erhalten.');
    const parsed = JSON.parse(rawText);

    return {
      extracted: parsed,
      document: {
        name: file.name,
        mimeType,
        dataUrl,
        uploadedAt: new Date().toISOString()
      }
    };
  }
};

const GoogleCalendarService = {
  accessToken: null,
  tokenClient: null,
  calendars: [],

  isConnected() {
    return !!this.accessToken;
  },

  async connect() {
    const settings = StorageService.getSettings();
    if (!settings.googleClientId) {
      throw new Error('Bitte tragen Sie zuerst Ihre Google OAuth Client-ID unter Einstellungen ein.');
    }
    if (!window.google?.accounts?.oauth2) {
      throw new Error('Google Identity Services Script wurde nicht geladen (Internetverbindung prüfen).');
    }

    return new Promise((resolve, reject) => {
      try {
        this.tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: settings.googleClientId.trim(),
          scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly',
          callback: async (tokenResponse) => {
            if (tokenResponse.error) {
              reject(new Error(`OAuth Fehler: ${tokenResponse.error}`));
              return;
            }
            this.accessToken = tokenResponse.access_token;
            try {
              await this.loadCalendars();
            } catch (e) { console.warn(e); }
            App.updateCalendarSidebarStatus();
            resolve(this.accessToken);
          }
        });
        this.tokenClient.requestAccessToken({ prompt: 'consent' });
      } catch (err) {
        reject(err);
      }
    });
  },

  async apiFetch(path, options = {}) {
    if (!this.accessToken) throw new Error('Nicht mit Google Kalender verbunden.');
    const res = await fetch(`https://www.googleapis.com/calendar/v3${path}`, {
      ...options,
      headers: {
        'Authorization': `Bearer ${this.accessToken}`,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
    if (res.status === 204) return null;
    const data = await res.json();
    if (!res.ok) {
      throw new Error(data?.error?.message || `Google Calendar API Fehler (${res.status})`);
    }
    return data;
  },

  async loadCalendars() {
    const data = await this.apiFetch('/users/me/calendarList');
    this.calendars = data.items || [];
    return this.calendars;
  },

  async checkAvailability(startIso, endIso) {
    const settings = StorageService.getSettings();
    const calId = settings.selectedCalendarId || 'primary';
    const data = await this.apiFetch('/freeBusy', {
      method: 'POST',
      body: JSON.stringify({
        timeMin: startIso,
        timeMax: endIso,
        timeZone: 'Europe/Berlin',
        items: [{ id: calId }]
      })
    });
    return data.calendars?.[calId]?.busy || [];
  },

  buildEventPayload(order) {
    const custName = `${order.customer.firstName} ${order.customer.lastName}`.trim() || order.customer.company || 'Unbekannter Kunde';
    const vehicleTitle = [order.vehicle.D1, order.vehicle.D3].filter(v => v && v !== 'unbekannt').join(' ') || 'Fahrzeug';
    const startD = order.job.startDate || todayISO();
    const endD = order.job.plannedCompletion || startD;
    const startT = order.job.startTime || '09:00';
    const endT = order.job.endTime || '17:00';

    const title = `FAVELA INDUSTRIES | ${order.orderNumber} | ${vehicleTitle} ${order.job.wrapType}`;
    const desc = [
      `Kunde: ${custName}`,
      `Fahrzeug: ${vehicleTitle}`,
      `Kennzeichen: ${order.vehicle.plate || '-'}`,
      `Auftragsnummer: ${order.orderNumber}`,
      `Leistung: ${order.job.wrapType}`,
      `Geplante Dauer: ${order.job.plannedHours || 0} Std.`,
      `Status: ${order.status}`,
      order.job.internalNotes ? `Interne Bemerkungen: ${order.job.internalNotes}` : ''
    ].filter(Boolean).join('\n');

    return {
      summary: title,
      description: desc,
      start: { dateTime: `${startD}T${startT}:00`, timeZone: 'Europe/Berlin' },
      end: { dateTime: `${endD}T${endT}:00`, timeZone: 'Europe/Berlin' }
    };
  },

  async syncOrderEvent(order) {
    const settings = StorageService.getSettings();
    const calId = encodeURIComponent(settings.selectedCalendarId || 'primary');
    if (!this.isConnected()) {
      order.calendar.syncStatus = 'pending';
      order.calendar.lastSyncError = 'Keine aktive Google-Kalender-Verbindung. Synchronisierung ausstehend.';
      await StorageService.put('orders', order);
      return { pending: true };
    }

    const payload = this.buildEventPayload(order);
    try {
      let ev;
      if (order.calendar.googleEventId) {
        ev = await this.apiFetch(`/calendars/${calId}/events/${encodeURIComponent(order.calendar.googleEventId)}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
      } else {
        ev = await this.apiFetch(`/calendars/${calId}/events`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
      }
      order.calendar.googleEventId = ev.id;
      order.calendar.googleEventLink = ev.htmlLink || '';
      order.calendar.syncStatus = 'synced';
      order.calendar.lastSyncError = '';
      await StorageService.put('orders', order);
      return { synced: true, event: ev };
    } catch (err) {
      order.calendar.syncStatus = 'error';
      order.calendar.lastSyncError = err.message;
      await StorageService.put('orders', order);
      throw err;
    }
  },

  async deleteOrderEvent(order) {
    if (!order.calendar?.googleEventId) return;
    if (!this.isConnected()) throw new Error('Bitte zuerst mit Google Kalender verbinden, um den Termin zu löschen.');
    const settings = StorageService.getSettings();
    const calId = encodeURIComponent(settings.selectedCalendarId || 'primary');
    await this.apiFetch(`/calendars/${calId}/events/${encodeURIComponent(order.calendar.googleEventId)}`, {
      method: 'DELETE'
    });
    order.calendar.googleEventId = '';
    order.calendar.googleEventLink = '';
    order.calendar.syncStatus = 'unsynced';
    await StorageService.put('orders', order);
  }
};

const PDFExportService = {
  runAutoTable(doc, options) {
    if (typeof doc.autoTable === 'function') {
      doc.autoTable(options);
    } else if (window.jspdf && typeof window.jspdf.autoTable === 'function') {
      window.jspdf.autoTable(doc, options);
    } else if (typeof window.autoTable === 'function') {
      window.autoTable(doc, options);
    } else {
      throw new Error('jsPDF-AutoTable Plugin ist nicht verfügbar.');
    }
  },

  getLastY(doc, fallback) {
    return doc.lastAutoTable?.finalY ?? fallback;
  },

  getLogoForPDF() {
    const settings = StorageService.getSettings();
    if (settings.logoDataUrl && settings.logoDataUrl.startsWith('data:image/')) {
      return settings.logoDataUrl;
    }
    const imgEl = document.getElementById('company-logo-img');
    if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
      try {
        const c = document.createElement('canvas');
        c.width = imgEl.naturalWidth;
        c.height = imgEl.naturalHeight;
        c.getContext('2d').drawImage(imgEl, 0, 0);
        return c.toDataURL('image/png');
      } catch { return null; }
    }
    return null;
  },

  safeAddImage(doc, dataUrl, x, y, maxW, maxH) {
    if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image/')) return 0;
    try {
      const fmt = dataUrl.includes('image/png') ? 'PNG' : 'JPEG';
      const props = doc.getImageProperties(dataUrl);
      const ratio = Math.min(maxW / props.width, maxH / props.height);
      const w = props.width * ratio;
      const h = props.height * ratio;
      doc.addImage(dataUrl, fmt, x, y, w, h);
      return h;
    } catch (e) {
      console.warn('Bild konnte nicht ins PDF eingebettet werden:', e);
      return 0;
    }
  },

  generate(order, variant = 'customer') {
    if (!window.jspdf?.jsPDF) {
      throw new Error('jsPDF Bibliothek wurde nicht geladen. Bitte Internetverbindung prüfen.');
    }
    const isInternal = variant === 'internal';
    const settings = StorageService.getSettings();
    if (isInternal && settings.role !== 'Inhaber') {
      throw new Error('Die interne Auftragsmappe darf nur in der Rolle "Inhaber" exportiert werden.');
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    const pageW = 210;
    const margin = 14;
    const contentW = pageW - margin * 2;
    const logoData = this.getLogoForPDF();
    const metrics = calcOrderMetrics(order);
    const titleLabel = isInternal ? 'INTERNE AUFTRAGSMAPPE' : 'KUNDENPROTOKOLL';

    const drawHeaderFooter = () => {
      const totalPages = doc.getNumberOfPages();

        doc.setPage(i);
        doc.setFillColor(16, 19, 26);
        doc.rect(0, 0, pageW, 24, 'F');
        doc.setFillColor(225, 29, 72);
        doc.rect(0, 24, pageW / 2, 1.3, 'F');
        doc.setFillColor(14, 165, 233);
        doc.rect(pageW / 2, 24, pageW / 2, 1.3, 'F');

        if (logoData) {
          this.safeAddImage(doc, logoData, margin, 3, 34, 18);
        }
        const textX = logoData ? margin + 38 : margin;
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.text('FAVELA INDUSTRIES', textX, 10);
        doc.setFontSize(7.5);
        doc.setTextColor(148, 163, 184);
        doc.text('VEHICLE WRAPPING & DESIGN', textX, 14.5);
        doc.setTextColor(14, 165, 233);
        doc.setFontSize(9);

        doc.setTextColor(255, 255, 255);

        doc.text(order.orderNumber, pageW - margin, 11, { align: 'right' });
        doc.setFontSize(8);
        doc.setTextColor(203, 213, 225);
        doc.text(`Status: ${order.status}`, pageW - margin, 17, { align: 'right' });

        doc.setDrawColor(45, 52, 68);

    let y = 32;

  }

const DamageSketch = {
  drawBaseVehicle(ctx, w, h) {
    ctx.fillStyle = '#0f131b';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 12px sans-serif';

    const drawSide = (ox, oy, label, flip = false) => {
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(label, 10, 18);
      ctx.fillStyle = '#1a2232';
      ctx.beginPath();
      if (!flip) {
        ctx.moveTo(20, 75); ctx.lineTo(32, 52); ctx.lineTo(75, 48); ctx.lineTo(115, 28);
        ctx.lineTo(205, 28); ctx.lineTo(245, 48); ctx.lineTo(265, 55); ctx.lineTo(265, 78);
        ctx.lineTo(20, 78);
      } else {
        ctx.moveTo(265, 75); ctx.lineTo(253, 52); ctx.lineTo(210, 48); ctx.lineTo(170, 28);
        ctx.lineTo(80, 28); ctx.lineTo(40, 48); ctx.lineTo(20, 55); ctx.lineTo(20, 78);
        ctx.lineTo(265, 78);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(68, 78, 16, 0, Math.PI * 2); ctx.fillStyle = '#0a0c10'; ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(215, 78, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.restore();
    };

    const drawFrontRear = (ox, oy, label) => {
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(label, 10, 18);
      ctx.fillStyle = '#1a2232';
      ctx.beginPath();
      ctx.moveTo(75, 82); ctx.lineTo(75, 56); ctx.lineTo(92, 30); ctx.lineTo(192, 30);
      ctx.lineTo(210, 56); ctx.lineTo(210, 82); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeRect(98, 35, 88, 18);
      ctx.strokeRect(82, 60, 22, 10);
      ctx.strokeRect(180, 60, 22, 10);
      ctx.restore();
    };

    drawSide(10, 8, 'LINKE SEITE', false);
    drawSide(305, 8, 'RECHTE SEITE', true);
    drawFrontRear(10, 128, 'FRONTANSICHT');
    drawFrontRear(305, 128, 'HECKANSICHT');

    ctx.strokeStyle = '#2a3040';
    ctx.beginPath(); ctx.moveTo(300, 10); ctx.lineTo(300, h - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, 120); ctx.lineTo(w - 10, 120); ctx.stroke();
  },

  drawMarkers(ctx, w, h, markers) {
    (markers || []).forEach((m, idx) => {
      const x = (m.xPct / 100) * w;
      const y = (m.yPct / 100) * h;
      ctx.beginPath();
      ctx.arc(x, y, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#e11d48';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(idx + 1), x, y);
    });
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  },

  renderToOffscreenCanvas(markers) {
    const c = document.createElement('canvas');
    c.width = 600; c.height = 240;
    const ctx = c.getContext('2d');
    this.drawBaseVehicle(ctx, c.width, c.height);
    this.drawMarkers(ctx, c.width, c.height, markers);
    return c;
  },

  mount(canvasEl, order, onUpdate) {
    if (!canvasEl) return;
    const ctx = canvasEl.getContext('2d');
    const redraw = () => {
      this.drawBaseVehicle(ctx, canvasEl.width, canvasEl.height);
      this.drawMarkers(ctx, canvasEl.width, canvasEl.height, order.intake.damageMarkers);
    };
    redraw();

    canvasEl.onclick = (e) => {
      const rect = canvasEl.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      let viewLabel = 'Front';
      if (yPct < 50 && xPct < 50) viewLabel = 'Linke Seite';
      else if (yPct < 50 && xPct >= 50) viewLabel = 'Rechte Seite';
      else if (yPct >= 50 && xPct < 50) viewLabel = 'Front';
      else viewLabel = 'Heck';

      const desc = prompt(`Schaden auf "${viewLabel}" beschreiben (z. B. Kratzer 5 cm / Delle):`);
      if (desc && desc.trim()) {
        order.intake.damageMarkers.push({
          id: uid('dmg'),
          xPct: Number(xPct.toFixed(2)),
          yPct: Number(yPct.toFixed(2)),
          viewLabel,
          description: desc.trim()
        });
        redraw();
        onUpdate();
      }
    };
  }
};

function setupSignaturePad(canvasId, initialDataUrl, onSave) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (initialDataUrl) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = initialDataUrl;
  }

  let drawing = false;
  const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (canvas.width / r.width),
      y: (e.clientY - r.top) * (canvas.height / r.height)
    };
  };

  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });
  const endStroke = () => {
    if (!drawing) return;
    drawing = false;
    onSave(canvas.toDataURL('image/png'));
  };
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
}

const App = {
  orders: [],
  tasks: [],
  currentView: 'dashboard',
  currentOrderId: null,
  currentOrderTab: 'stammdaten',
  searchQuery: '',
  filterStatus: 'ALLE',
  filterDateFrom: '',
  filterDateTo: '',
  activeTimer: null,
  timerInterval: null,
  draftOrder: null,

  async init() {
    await StorageService.init();
    await this.reloadData();
    this.applySettingsToUI();
    this.restoreActiveTimer();
    this.navigate('dashboard');
  },

  async reloadData() {
    this.orders = (await StorageService.getAll('orders')).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    this.tasks = await StorageService.getAll('tasks');
  },

  applySettingsToUI() {
    const s = StorageService.getSettings();
    document.getElementById('active-role-select').value = s.role;
    const userSel = document.getElementById('active-user-select');
    userSel.innerHTML = s.employees.map(e => `<option value="${escapeAttr(e.name)}">${escapeHtml(e.name)}</option>`).join('');
    if (s.employees.some(e => e.name === s.activeUser)) {
      userSel.value = s.activeUser;
    } else if (s.employees.length) {
      userSel.value = s.employees[0].name;
    }

    const imgEl = document.getElementById('company-logo-img');
    const fbEl = document.getElementById('company-logo-fallback');
    if (s.logoDataUrl) {
      imgEl.src = s.logoDataUrl;
      imgEl.style.display = 'block';
      fbEl.style.display = 'none';
    } else {
      imgEl.onload = () => { imgEl.style.display = 'block'; fbEl.style.display = 'none'; };
      imgEl.onerror = () => { imgEl.style.display = 'none'; fbEl.style.display = 'block'; };
      imgEl.src = 'logo.png';
    }
    this.updateCalendarSidebarStatus();
  },

  updateCalendarSidebarStatus() {
    const el = document.getElementById('sidebar-gcal-info');
    if (!el) return;
    el.innerHTML = GoogleCalendarService.isConnected()
      ? '<span style="color:var(--success);">● Kalender: Verbunden</span>'
      : '<span style="color:var(--text-dim);">○ Kalender: Nicht verbunden</span>';
  },

  isOwner() {
    return StorageService.getSettings().role === 'Inhaber';
  },

  changeRole(role) {
    const s = StorageService.getSettings();
    s.role = role;
    StorageService.saveSettings(s);
    showToast(`Aktive Rolle gewechselt auf: ${role}`);
    this.renderCurrentView();
  },

  changeActiveUser(name) {
    const s = StorageService.getSettings();
    s.activeUser = name;
    const emp = s.employees.find(e => e.name === name);
    if (emp) {
      s.role = emp.role;
      document.getElementById('active-role-select').value = emp.role;
    }
    StorageService.saveSettings(s);
    this.renderCurrentView();
  },

  navigate(view, orderId = null, tab = null) {
    this.currentView = view;
    if (orderId) this.currentOrderId = orderId;
    if (tab) this.currentOrderTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    document.getElementById('sidebar').classList.remove('open');
    this.renderCurrentView();
  },

  handleGlobalSearch(q) {
    this.searchQuery = q.trim().toLowerCase();
    if (this.currentView !== 'orders' && this.currentView !== 'dashboard') {
      this.navigate('orders');
    } else {
      this.renderCurrentView();
    }
  },

  generateNextOrderNumber() {
    const year = new Date().getFullYear();
    const prefix = `FI-${year}-`;
    let maxSeq = 0;
    this.orders.forEach(o => {
      if (o.orderNumber && o.orderNumber.startsWith(prefix)) {
        const n = parseInt(o.orderNumber.slice(prefix.length), 10);
        if (!isNaN(n) && n > maxSeq) maxSeq = n;
      }
    });
    return `${prefix}${String(maxSeq + 1).padStart(3, '0')}`;
  },

  async saveOrder(order, silent = false) {
    order.updatedAt = new Date().toISOString();
    await StorageService.put('orders', order);
    await this.reloadData();
    if (!silent) showToast(`Auftrag ${order.orderNumber} gespeichert.`, 'success');
  },

  getFilteredOrders() {
    return this.orders.filter(o => {
      if (this.filterStatus !== 'ALLE' && o.status !== this.filterStatus) return false;
      if (this.filterDateFrom && (o.job?.startDate || '') < this.filterDateFrom) return false;
      if (this.filterDateTo && (o.job?.startDate || '') > this.filterDateTo) return false;
      if (this.searchQuery) {
        const hay = [
          o.orderNumber, o.customer.firstName, o.customer.lastName, o.customer.company,
          o.vehicle.D1, o.vehicle.D3, o.vehicle.plate, o.vehicle.E, o.job.wrapType
        ].join(' ').toLowerCase();
        if (!hay.includes(this.searchQuery)) return false;
      }
      return true;
    });
  },

  renderCurrentView() {
    const root = document.getElementById('app-view');
    if (this.currentView === 'dashboard') this.renderDashboard(root);
    else if (this.currentView === 'orders') this.renderOrdersList(root);
    else if (this.currentView === 'new-order') this.renderNewOrderWizard(root);
    else if (this.currentView === 'order-detail') this.renderOrderDetail(root);
    else if (this.currentView === 'tasks') this.renderTasksAndCalendar(root);
    else if (this.currentView === 'settings') this.renderSettings(root);

  renderDashboard(root) {
    const owner = this.isOwner();
    const now = new Date();
    const curYM = now.toISOString().slice(0, 7);
    const in7Days = new Date(now.getTime() + 7 * 86400000).toISOString().slice(0, 10);
    const today = todayISO();

    const activeStatuses = ['Anfrage', 'Angebot erstellt', 'Auftrag bestätigt', 'Termin geplant', 'Fahrzeug angenommen', 'In Bearbeitung', 'Qualitätskontrolle', 'Abholbereit'];
    const activeOrders = this.orders.filter(o => activeStatuses.includes(o.status));
    const scheduled = this.orders.filter(o => o.status === 'Termin geplant');
    const inProgress = this.orders.filter(o => o.status === 'In Bearbeitung');
    const inQC = this.orders.filter(o => o.status === 'Qualitätskontrolle');
    const ready = this.orders.filter(o => o.status === 'Abholbereit');
    const notHandedOver = this.orders.filter(o => ['Fahrzeug angenommen', 'In Bearbeitung', 'Qualitätskontrolle', 'Abholbereit'].includes(o.status));
    const next7 = this.orders.filter(o => o.job?.startDate && o.job.startDate >= today && o.job.startDate <= in7Days && o.status !== 'Storniert');
    const openTasks = this.tasks.filter(t => !t.done);

    let monthRevenue = 0;
    let monthMaterial = 0;
    let totalHoursAll = 0;
    let quoteSum = 0;
    let quoteCount = 0;

      if (o.status === 'Storniert') return;
      const m = calcOrderMetrics(o);
      totalHoursAll += m.totalHours;
      if ((o.createdAt || '').startsWith(curYM) || (o.job?.startDate || '').startsWith(curYM)) {
        monthRevenue += m.netPrice;
        monthMaterial += m.totalMaterialCost;
      }
      if (m.netPrice > 0) {
        quoteSum += m.materialQuotePct;
        quoteCount++;
      }
    });

    const nonCancelled = this.orders.filter(o => o.status !== 'Storniert');
    const avgMaterialQuote = quoteCount > 0 ? quoteSum / quoteCount : 0;
    const avgHours = nonCancelled.length > 0 ? totalHoursAll / nonCancelled.length : 0;

    const kpis = [
      { label: 'Aktive Aufträge', val: activeOrders.length, sub: 'Nicht abgeschlossen / storniert' },
      { label: 'Geplante Fahrzeuge', val: scheduled.length, sub: 'Status: Termin geplant' },

      { label: 'Ø Arbeitszeit / Auftrag', val: `${avgHours.toFixed(1)} h`, sub: 'Durchschnittswert' }

    if (owner) {
      kpis.push(
        { label: 'Monatsumsatz (Netto)', val: formatEUR(monthRevenue), sub: `Monat ${curYM}` },
        { label: 'Materialkosten Monat', val: formatEUR(monthMaterial), sub: `Monat ${curYM}` },

    const filtered = this.getFilteredOrders();

    root.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">

        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">

      ${!owner ? `<div class="alert alert-info">🔒 Eingeschränkte Mitarbeiter-Ansicht: Finanzielle Auswertungen, Einkaufspreise und Deckungsbeiträge sind ausgeblendet.</div>` : ''}

      <div class="kpi-grid">
        ${kpis.map(k => `

      <div class="card accent-bar-red">
        <div class="card-header">

          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            <select id="dash-status-filter" style="width:auto;">
              <option value="ALLE">Alle Status</option>
              ${SCHEMAS.STATUSES.map(s => `<option value="${escapeAttr(s.key)}" ${this.filterStatus === s.key ? 'selected' : ''}>${escapeHtml(s.key)}</option>`).join('')}
            </select>
            <button class="btn btn-sm" onclick="App.navigate('orders')">Alle Filter &amp; Liste →</button>
          </div>
        </div>
        ${this.renderOrdersTableHTML(filtered.slice(0, 12), owner)}
      </div>

      <div class="grid grid-2">
        <div class="card accent-bar-blue">
          <div class="card-header"><div class="card-title">📅 Termine nächste 7 Tage</div></div>
          <div id="dash-next7-list"></div>
        </div>

    document.getElementById('dash-status-filter').onchange = (e) => {

    const next7El = document.getElementById('dash-next7-list');

    } else {

            <div style="font-size:12px;color:var(--text-muted);">${escapeHtml(o.customer.firstName)} ${escapeHtml(o.customer.lastName)} • ${escapeHtml(o.job.wrapType)}</div>

    const tasksEl = document.getElementById('dash-tasks-list');

      try {

        showToast(`Kalender-Sync Fehler: ${err.message}`, 'error');

    this.openOrder(createdId);

      { id: 'zeit', label: `3. Arbeitszeiten (${order.timeLogs.length})` },
      { id: 'annahme', label: '4. Annahme & Skizze' },
      { id: 'qc', label: '5. Qualitätskontrolle' },
      { id: 'uebergabe', label: '6. Übergabe' },
      ...(owner ? [{ id: 'wirtschaft', label: '7. Wirtschaftlichkeit' }] : []),
      { id: 'export', label: '8. Kalender & PDF-Export' }
    ];

    if (!owner && this.currentOrderTab === 'wirtschaft') this.currentOrderTab = 'stammdaten';

    root.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="App.navigate('orders')">← Zurück</button>
            <h1 style="font-size:21px;font-weight:800;">${escapeHtml(order.orderNumber)}</h1>
            ${statusBadge(order.status)}
          </div>
          <p style="color:var(--text-muted);font-size:13px;margin-top:4px;">
            ${escapeHtml(order.customer.firstName)} ${escapeHtml(order.customer.lastName)} •
            ${escapeHtml(order.vehicle.D1)} ${escapeHtml(order.vehicle.D3)} (${escapeHtml(order.vehicle.plate || 'ohne Kennzeichen')}) •
            ${escapeHtml(order.job.wrapType)}
          </p>
        </div>

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <label class="form-label" style="margin:0;">Status:</label>
          <select id="detail-status-select" style="width:auto;">
            ${SCHEMAS.STATUSES.map(s => `<option value="${escapeAttr(s.key)}" ${order.status === s.key ? 'selected' : ''}>${escapeHtml(s.key)}</option>`).join('')}
          </select>
          <button class="btn btn-blue btn-sm" onclick="App.exportPDF('${escapeAttr(order.id)}', 'customer')">📄 Kunden-PDF</button>
          ${owner ? `<button class="btn btn-primary btn-sm" onclick="App.exportPDF('${escapeAttr(order.id)}', 'internal')">🔒 Interne Mappe PDF</button>` : ''}
        </div>
      </div>

      <div class="tabs-bar" id="order-tabs-bar"></div>
      <div id="order-tab-body"></div>
    `;

    document.getElementById('detail-status-select').onchange = (e) => this.changeOrderStatus(order.id, e.target.value);

    const tabsBar = document.getElementById('order-tabs-bar');
    tabs.forEach(t => {
      const btn = document.createElement('button');
      btn.className = `tab-btn ${this.currentOrderTab === t.id ? 'active' : ''}`;
      btn.textContent = t.label;
      btn.onclick = () => { this.currentOrderTab = t.id; this.renderCurrentView(); };
      tabsBar.appendChild(btn);
    });

    const body = document.getElementById('order-tab-body');
    if (this.currentOrderTab === 'stammdaten') this.renderTabStammdaten(body, order, owner);
    else if (this.currentOrderTab === 'material') this.renderTabMaterial(body, order, owner);
    else if (this.currentOrderTab === 'zeit') this.renderTabTime(body, order);
    else if (this.currentOrderTab === 'annahme') this.renderTabIntake(body, order);
    else if (this.currentOrderTab === 'qc') this.renderTabQC(body, order);
    else if (this.currentOrderTab === 'uebergabe') this.renderTabHandover(body, order);
    else if (this.currentOrderTab === 'wirtschaft' && owner) this.renderTabProfitability(body, order);
    else if (this.currentOrderTab === 'export') this.renderTabExportCalendar(body, order, owner);
  },

  async changeOrderStatus(orderId, newStatus) {
    const order = this.orders.find(o => o.id === orderId);
    if (!order) return;

    if (['Abholbereit', 'Übergeben', 'Abgeschlossen'].includes(newStatus) && order.qc.status !== 'Qualitätskontrolle bestanden') {
      showToast('Gesperrt: Status "Abholbereit" / "Übergeben" erst nach bestandener Qualitätskontrolle möglich!', 'error');
      this.renderCurrentView();
      return;
    }

    if (newStatus === 'Abgeschlossen' && !order.vehicleDataVerified) {
      showToast('Gesperrt: Bitte prüfen und bestätigen Sie zuerst die ausgelesenen Fahrzeugdaten unter Tab 1.', 'error');
      this.renderCurrentView();
      return;
    }

    order.status = newStatus;
    await this.saveOrder(order);
    if (order.calendar?.googleEventId && GoogleCalendarService.isConnected()) {
      try { await GoogleCalendarService.syncOrderEvent(order); } catch {}
    }
    this.renderCurrentView();
  },

  bindBaseFormEvents(order, onAfterAutoSave, isDraft = false) {
    const setNested = (path, val) => {
      const parts = path.split('.');
      let cur = order;
      for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
      cur[parts[parts.length - 1]] = val;
    };

    document.querySelectorAll('[data-bind]').forEach(el => {
      el.addEventListener('input', () => {
        const path = el.dataset.bind;
        let val = el.value;
        if (el.type === 'number') val = parseFloat(val) || 0;
        setNested(path, val);
        if (path.startsWith('vehicle.')) {
          order.vehicleDataVerified = false;
          const chk = document.getElementById('chk-vehicle-verified');
          if (chk) {
            chk.checked = false;
            chk.closest('.check-item')?.classList.remove('checked');
          }
        }
        if (path === 'job.netPrice' || path === 'job.vatRate') {
          const m = calcOrderMetrics(order);
          order.job.grossPrice = m.grossPrice;
          const out = document.getElementById('out-gross-price');
          if (out) out.value = formatEUR(m.grossPrice);
        }
      });
      el.addEventListener('change', () => onAfterAutoSave());
    });

    const verChk = document.getElementById('chk-vehicle-verified');
    if (verChk) {
      verChk.addEventListener('change', () => {
        order.vehicleDataVerified = verChk.checked;
        verChk.closest('.check-item').classList.toggle('checked', verChk.checked);
        onAfterAutoSave();
      });
    }

    const viewRegBtn = document.getElementById('btn-view-reg-doc');
    if (viewRegBtn) viewRegBtn.onclick = () => this.viewSavedRegistrationDoc();

    const scanBtn = document.getElementById('btn-scan-fahrzeugschein');
    if (scanBtn) {
      scanBtn.onclick = async () => {
        const fileInput = document.getElementById('fahrzeugschein-upload');
        const file = fileInput?.files?.[0];
        if (!file) { showToast('Bitte zuerst ein Foto oder PDF des Fahrzeugscheins auswählen.', 'error'); return; }
        const statusEl = document.getElementById('ocr-status-msg');
        statusEl.innerHTML = '<div class="alert alert-info">⏳ Dokument wird an Gemini API gesendet und ausgelesen...</div>';
        scanBtn.disabled = true;
        try {
          const { extracted, document: docObj } = await GeminiOCRService.extractVehicleData(file);
          Object.keys(extracted).forEach(k => {
            if (k in order.vehicle) order.vehicle[k] = extracted[k] || 'unbekannt';
          });
          order.fahrzeugscheinDoc = docObj;
          order.vehicleDataVerified = false;
          onAfterAutoSave();
          showToast('Fahrzeugschein ausgelesen! Bitte alle Daten jetzt prüfen und bestätigen.', 'success');
          this.renderCurrentView();
        } catch (err) {
          statusEl.innerHTML = `<div class="alert alert-danger">Fehler beim Auslesen: ${escapeHtml(err.message)}</div>`;
          showToast(err.message, 'error');
        } finally {
          scanBtn.disabled = false;
        }
      };
    }

    const grid = document.getElementById('order-photos-grid');
    if (grid) {
      grid.innerHTML = '';
      (order.photos || []).forEach(p => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img />
          <div class="photo-meta">
            <span><strong>${escapeHtml(p.category)}</strong></span>
            <button class="btn btn-sm btn-danger" type="button">✕</button>
          </div>
        `;
        const img = card.querySelector('img');
        img.src = p.dataUrl;
        img.onclick = () => openImagePreview(p.dataUrl, p.category);
        card.querySelector('button').onclick = () => this.removeOrderPhoto(p.id, isDraft);
        grid.appendChild(card);
      });
    }

    const photoBtn = document.getElementById('btn-add-photos');
    if (photoBtn) {
      photoBtn.onclick = async () => {
        const inp = document.getElementById('photo-multi-upload');
        const cat = document.getElementById('photo-cat-select').value;
        const files = Array.from(inp.files || []);
        if (!files.length) { showToast('Bitte mindestens ein Foto auswählen.', 'error'); return; }
        for (const f of files) {
          const dataUrl = await compressImageFile(f);
          order.photos.push({ id: uid('ph'), category: cat, name: f.name, dataUrl, createdAt: new Date().toISOString() });
        }
        onAfterAutoSave();
        this.renderCurrentView();
        showToast(`${files.length} Foto(s) hinzugefügt.`, 'success');
      };
    }
  },

  viewSavedRegistrationDoc() {
    const order = this.currentView === 'new-order' ? this.draftOrder : this.getCurrentOrder();
    const doc = order?.fahrzeugscheinDoc;
    if (!doc) return;
    if (doc.mimeType === 'application/pdf') {
      const w = window.open();
      if (w) {
        const iframe = w.document.createElement('iframe');
        iframe.src = doc.dataUrl;
        iframe.style.cssText = 'width:100%;height:100vh;border:0;';
        w.document.body.style.margin = '0';
        w.document.body.appendChild(iframe);
      }
    } else {
      openImagePreview(doc.dataUrl, `Fahrzeugschein: ${doc.name}`);
    }
  },

  async removeOrderPhoto(photoId, isDraft) {
    const order = isDraft ? this.draftOrder : this.getCurrentOrder();
    if (!order) return;
    confirmModal('Foto löschen?', 'Soll dieses Fahrzeugfoto wirklich entfernt werden?', async () => {
      order.photos = order.photos.filter(p => p.id !== photoId);
      if (!isDraft) await this.saveOrder(order);
      this.renderCurrentView();
    });
  },

      </div>
    `;
    this.bindBaseFormEvents(order, () => this.saveOrder(order, true), false);
  },

  async addMaterialRow(orderId) {
    const order = this.orders.find(o => o.id === orderId);
    order.materials.push({
      id: uid('mat'), category: 'Wrappingfolie', brand: '', product: '', sku: '',
      widthMm: 1520, lengthM: 0, areaM2: 0, unit: 'm', qty: 0, unitCost: 0, totalCost: 0, supplier: '', notes: ''
    });
    await this.saveOrder(order, true);
    this.renderCurrentView();
  },

  async updateMat(orderId, idx, field, val) {
    const order = this.orders.find(o => o.id === orderId);
    const row = order.materials[idx];
    if (['widthMm', 'lengthM', 'areaM2', 'qty', 'unitCost'].includes(field)) {
      row[field] = parseFloat(val) || 0;
    } else {
      row[field] = val;
    }
    if (field === 'lengthM' || field === 'widthMm') {
      if (row.widthMm > 0 && row.lengthM > 0) {
        row.areaM2 = Number(((row.widthMm / 1000) * row.lengthM).toFixed(2));
      }
      if (row.unit === 'm') row.qty = row.lengthM;
      else if (row.unit === 'm²') row.qty = row.areaM2;
    }
    if (field === 'areaM2' && row.unit === 'm²') row.qty = row.areaM2;
    if (field === 'unit') {
      if (val === 'm') row.qty = row.lengthM;
      else if (val === 'm²') row.qty = row.areaM2;
    }
    row.totalCost = Number((row.qty * row.unitCost).toFixed(2));
    await this.saveOrder(order, true);
    this.renderCurrentView();
  },

  async deleteMat(orderId, idx) {
    const order = this.orders.find(o => o.id === orderId);
    order.materials.splice(idx, 1);
    await this.saveOrder(order);
    this.renderCurrentView();
  },

  async updateOrderField(orderId, field, val) {
    const order = this.orders.find(o => o.id === orderId);
    order[field] = val;
    await this.saveOrder(order, true);
  },

  restoreActiveTimer() {
    try {
      const raw = localStorage.getItem(StorageService.TIMER_KEY);
      if (raw) {
        this.activeTimer = JSON.parse(raw);
        this.startTimerTicker();
      }
    } catch {}
  },

  saveActiveTimerState() {
    if (this.activeTimer) localStorage.setItem(StorageService.TIMER_KEY, JSON.stringify(this.activeTimer));
    else localStorage.removeItem(StorageService.TIMER_KEY);
    this.updateTimerPill();
  },

  startTimerTicker() {
    if (this.timerInterval) clearInterval(this.timerInterval);
    this.updateTimerPill();
    this.timerInterval = setInterval(() => {
      this.updateTimerPill();
      const liveEl = document.getElementById('live-timer-display');
      if (liveEl && this.activeTimer) liveEl.textContent = this.formatTimerElapsed(this.activeTimer);
    }, 1000);
  },

  getTimerElapsedMs(t) {
    if (!t) return 0;
    const now = Date.now();
    const curPause = t.pausedAt ? (now - t.pausedAt) : 0;
    return Math.max(0, now - t.startMs - (t.totalPauseMs || 0) - curPause);
  },

  formatTimerElapsed(t) {
    const sec = Math.floor(this.getTimerElapsedMs(t) / 1000);
    const h = String(Math.floor(sec / 3600)).padStart(2, '0');
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  },

  updateTimerPill() {
    const pill = document.getElementById('active-timer-pill');
    if (!pill) return;
    if (!this.activeTimer) { pill.style.display = 'none'; return; }
    const t = this.activeTimer;
    pill.style.display = 'flex';
    pill.innerHTML = `
      <span>⏱ ${escapeHtml(t.orderNumber)}: ${this.formatTimerElapsed(t)} ${t.pausedAt ? '(Pause)' : ''}</span>
      <button class="btn btn-sm" style="padding:2px 7px;" onclick="App.openOrder('${escapeAttr(t.orderId)}', 'zeit')">Öffnen</button>
    `;
  },

  startWorkTimer(orderId) {
    if (this.activeTimer) {
      showToast('Es läuft bereits eine Arbeitszeit-Stoppuhr! Bitte diese zuerst beenden.', 'error');
      return;
    }
    const order = this.orders.find(o => o.id === orderId);
    const s = StorageService.getSettings();
    const activity = document.getElementById('timer-activity-select')?.value || 'Folierung';
    const notes = document.getElementById('timer-notes-input')?.value || '';
    this.activeTimer = {
      orderId, orderNumber: order.orderNumber,
      employee: s.activeUser, activity, notes,
      startMs: Date.now(), startTimeStr: nowTimeHHMM(), date: todayISO(),
      pausedAt: null, totalPauseMs: 0
    };
    this.saveActiveTimerState();
    this.startTimerTicker();
    this.renderCurrentView();
    showToast('Arbeitszeit gestartet.', 'success');
  },

  pauseWorkTimer() {
    if (!this.activeTimer || this.activeTimer.pausedAt) return;
    this.activeTimer.pausedAt = Date.now();
    this.saveActiveTimerState();
    this.renderCurrentView();
  },

  resumeWorkTimer() {
    if (!this.activeTimer || !this.activeTimer.pausedAt) return;
    this.activeTimer.totalPauseMs += (Date.now() - this.activeTimer.pausedAt);
    this.activeTimer.pausedAt = null;
    this.saveActiveTimerState();
    this.renderCurrentView();
  },

  async stopWorkTimer() {
    const t = this.activeTimer;
    if (!t) return;
    if (t.pausedAt) {
      t.totalPauseMs += (Date.now() - t.pausedAt);
      t.pausedAt = null;
    }
    const elapsedHrs = Number((this.getTimerElapsedMs(t) / 3600000).toFixed(2));
    const pauseMin = Math.round((t.totalPauseMs || 0) / 60000);
    const order = this.orders.find(o => o.id === t.orderId);
    if (order) {
      order.timeLogs.push({
        id: uid('tl'),
        employee: t.employee,
        date: t.date,
        startTime: t.startTimeStr,
        endTime: nowTimeHHMM(),
        pauseMinutes: pauseMin,
        effectiveHours: Math.max(0.01, elapsedHrs),
        activity: t.activity,
        notes: document.getElementById('timer-notes-input')?.value || t.notes || ''
      });
      await this.saveOrder(order);
    }
    this.activeTimer = null;
    clearInterval(this.timerInterval);
    this.saveActiveTimerState();
    this.renderCurrentView();
  },

  computeHoursFromTimes(start, end, pauseMin) {
    const [sh, sm] = (start || '00:00').split(':').map(Number);
    const [eh, em] = (end || '00:00').split(':').map(Number);
    let mins = (eh * 60 + em) - (sh * 60 + sm) - (Number(pauseMin) || 0);
    if (mins < 0) mins += 24 * 60;
    return Number(Math.max(0, mins / 60).toFixed(2));
  },

  async addManualTimeLog(orderId) {

    const startTime = document.getElementById('man-start').value;
    const endTime = document.getElementById('man-end').value;
    const pauseMinutes = parseInt(document.getElementById('man-pause').value, 10) || 0;
    const effectiveHours = this.computeHoursFromTimes(startTime, endTime, pauseMinutes);

    order.timeLogs.push({
      id: uid('tl'),
      employee: document.getElementById('man-emp').value,
      date: document.getElementById('man-date').value,
      startTime, endTime, pauseMinutes, effectiveHours,
      activity: document.getElementById('man-act').value,
      notes: document.getElementById('man-notes').value
    });
    await this.saveOrder(order);
    this.renderCurrentView();
  },

  async editTimeLog(orderId, idx, field, val) {
    const order = this.orders.find(o => o.id === orderId);
    const row = order.timeLogs[idx];
    row[field] = field === 'pauseMinutes' ? (parseInt(val, 10) || 0) : val;
    if (['startTime', 'endTime', 'pauseMinutes'].includes(field)) {
      row.effectiveHours = this.computeHoursFromTimes(row.startTime, row.endTime, row.pauseMinutes);
    }
    await this.saveOrder(order, true);
    this.renderCurrentView();
  },

    order.timeLogs.splice(idx, 1);

    this.renderCurrentView();

      const lab = document.createElement('label');
      lab.className = `check-item ${ink.checks[lbl] ? 'checked' : ''}`;
      lab.innerHTML = `<input type="checkbox" ${ink.checks[lbl] ? 'checked' : ''} /><span>${escapeHtml(lbl)}</span>`;
      const box = lab.querySelector('input');
      box.onchange = () => {
        ink.checks[lbl] = box.checked;
        lab.classList.toggle('checked', box.checked);
        this.saveOrder(order, true);
      };
      chkGrid.appendChild(lab);
    });

    const bindMap = [
      ['ink-fuel', 'intake.fuelLevel'],
      ['ink-mileage', 'intake.mileage'],
      ['ink-keys', 'intake.keysCount'],
      ['ink-acc', 'intake.accessories'],
      ['ink-items', 'intake.itemsInCar'],
      ['ink-notes', 'intake.specialNotes'],
      ['ink-date', 'intake.date'],
      ['ink-time', 'intake.time']
    ];
    bindMap.forEach(([id, path]) => {
      const el = document.getElementById(id);
      if (el) el.onchange = () => this.updateNestedField(order.id, path, el.value);
    });

    const jointEl = document.getElementById('ink-joint');
    jointEl.onchange = () => {
      ink.jointConfirmation = jointEl.checked;
      jointEl.closest('.check-item').classList.toggle('checked', jointEl.checked);
      this.saveOrder(order, true);
    };

    const renderMarkersList = () => {
      const listEl = document.getElementById('damage-markers-list');
      if (ink.damageMarkers.length === 0) {
        listEl.innerHTML = '<p style="color:var(--text-dim);">Keine Schäden auf der Skizze markiert.</p>';
        return;
      }
      listEl.innerHTML = '';
      ink.damageMarkers.forEach((dm, i) => {
        const div = document.createElement('div');
        div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;';
        div.innerHTML = `<span><strong style="color:var(--accent-red);">#${i + 1} (${escapeHtml(dm.viewLabel)}):</strong> ${escapeHtml(dm.description)}</span><button class="btn btn-sm btn-danger" type="button">✕</button>`;
        div.querySelector('button').onclick = () => {
          ink.damageMarkers = ink.damageMarkers.filter(x => x.id !== dm.id);
          this.saveOrder(order, true);
          DamageSketch.mount(document.getElementById('intake-sketch-canvas'), order, renderMarkersList);
          renderMarkersList();
        };
        listEl.appendChild(div);
      });
    };

    DamageSketch.mount(document.getElementById('intake-sketch-canvas'), order, async () => {
      await this.saveOrder(order, true);
      renderMarkersList();
    });
    renderMarkersList();

    document.getElementById('btn-clear-markers').onclick = async () => {
      ink.damageMarkers = [];
      await this.saveOrder(order, true);
      DamageSketch.mount(document.getElementById('intake-sketch-canvas'), order, renderMarkersList);
      renderMarkersList();

    const pGrid = document.getElementById('intake-photos-grid');
    ink.photos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `<img /><div class="photo-meta"><span>${escapeHtml(p.name)}</span><button class="btn btn-sm btn-danger" type="button">✕</button></div>`;
      const img = card.querySelector('img');
      img.src = p.dataUrl;
      img.onclick = () => openImagePreview(p.dataUrl, 'Annahmefoto');
      card.querySelector('button').onclick = () => this.removeIntakePhoto(order.id, p.id);
      pGrid.appendChild(card);
    });
    document.getElementById('btn-add-intake-photos').onclick = () => this.addIntakePhotos(order.id);

    setupSignaturePad('sig-intake-cust', ink.customerSignature, (url) => { ink.customerSignature = url; this.saveOrder(order, true); });
    setupSignaturePad('sig-intake-staff', ink.staffSignature, (url) => { ink.staffSignature = url; this.saveOrder(order, true); });
    document.getElementById('btn-clr-sig-ink-c').onclick = () => { ink.customerSignature = ''; this.saveOrder(order, true); setupSignaturePad('sig-intake-cust', '', () => {}); };
    document.getElementById('btn-clr-sig-ink-s').onclick = () => { ink.staffSignature = ''; this.saveOrder(order, true); setupSignaturePad('sig-intake-staff', '', () => {}); };
  },

  async addIntakePhotos(orderId) {
    const o = this.orders.find(x => x.id === orderId);
    const files = Array.from(document.getElementById('intake-photo-input')?.files || []);
    if (!files.length) return;
    for (const f of files) {
      o.intake.photos.push({ id: uid('iph'), name: f.name, dataUrl: await compressImageFile(f) });
    }
    await this.saveOrder(o);
    this.renderCurrentView();

  async removeIntakePhoto(orderId, pid) {
    const o = this.orders.find(x => x.id === orderId);
    o.intake.photos = o.intake.photos.filter(p => p.id !== pid);

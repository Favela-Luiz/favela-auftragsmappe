  renderTabQC(body, order) {
    const qc = order.qc;
    const totalChecks = Object.keys(qc.checks).length;
    const doneChecks = Object.values(qc.checks).filter(Boolean).length;
    const allChecked = totalChecks === doneChecks;

    body.innerHTML = `
      <div id="qc-progress-banner" class="alert ${allChecked ? 'alert-success' : 'alert-warn'}">
        Prüffortschritt: <strong>${doneChecks} von ${totalChecks}</strong> Pflichtpunkten geprüft.
        ${!allChecked ? 'Die Qualitätskontrolle darf erst als „bestanden“ abgeschlossen werden, wenn alle Pflichtpunkte abgehakt sind.' : 'Alle Prüfpunkte abgehakt – Endfreigabe möglich.'}
      </div>

      <div id="qc-sections-wrap"></div>

      <div class="card accent-bar-red">
        <div class="card-header"><div class="card-title">⚠️ Abweichungen &amp; Nacharbeitsstellen dokumentieren</div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
          <input id="qc-dev-desc" placeholder="Beschreibung der Abweichung (z. B. Staubeinschluss Kotflügel links)" style="flex:1;min-width:240px;" />
          <input type="file" id="qc-dev-file" accept="image/*" style="max-width:260px;" />
          <button class="btn btn-primary" id="btn-add-qc-dev" type="button">➕ Abweichung erfassen</button>
        </div>
        <div id="qc-dev-list"></div>
      </div>

      <div class="card accent-bar-blue">
        <div class="card-header"><div class="card-title">🛡 Freigabe &amp; Endkontrolle</div></div>
        <div class="grid grid-3">
          <div class="form-group"><label class="form-label">QK durchgeführt von (Mitarbeiter)</label><input id="qc-inspector" value="${escapeAttr(qc.inspector)}" /></div>
          <div class="form-group"><label class="form-label">Endkontrolle (verantwortliche Person)</label><input id="qc-approver" value="${escapeAttr(qc.finalApprover)}" /></div>
          <div class="form-group"><label class="form-label">Aktueller QK-Status</label><input readonly value="${escapeAttr(qc.status)}" /></div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn btn-success btn-lg" id="btn-qc-pass" type="button">✅ Qualitätskontrolle bestanden (Abholbereit freischalten)</button>
          <button class="btn btn-warning" id="btn-qc-rework" type="button">🔧 Nacharbeit erforderlich (Aufgabe anlegen)</button>
          <button class="btn btn-danger" id="btn-qc-repeat" type="button">🔁 Qualitätskontrolle wiederholen</button>
        </div>
      </div>
    `;

    const secWrap = document.getElementById('qc-sections-wrap');
    SCHEMAS.QC_SECTIONS.forEach(sec => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="card-header"><div class="card-title">${escapeHtml(sec.title)}</div></div><div class="check-grid"></div>`;
      const grid = card.querySelector('.check-grid');
      sec.items.forEach(item => {
        const key = `${sec.code}:${item}`;
        const checked = !!qc.checks[key];
        const lab = document.createElement('label');
        lab.className = `check-item ${checked ? 'checked' : ''}`;
        lab.innerHTML = `<input type="checkbox" ${checked ? 'checked' : ''} /><span>${escapeHtml(item)}</span>`;
        const box = lab.querySelector('input');
        box.onchange = () => {
          qc.checks[key] = box.checked;
          lab.classList.toggle('checked', box.checked);
          this.saveOrder(order, true);
          const doneNow = Object.values(qc.checks).filter(Boolean).length;
          const okNow = doneNow === totalChecks;
          const banner = document.getElementById('qc-progress-banner');
          banner.className = `alert ${okNow ? 'alert-success' : 'alert-warn'}`;
          banner.innerHTML = `Prüffortschritt: <strong>${doneNow} von ${totalChecks}</strong> Pflichtpunkten geprüft. ${!okNow ? 'Die Qualitätskontrolle darf erst als „bestanden“ abgeschlossen werden, wenn alle Pflichtpunkte abgehakt sind.' : 'Alle Prüfpunkte abgehakt – Endfreigabe möglich.'}`;
        };
        grid.appendChild(lab);
      });
      secWrap.appendChild(card);
    });

    const devList = document.getElementById('qc-dev-list');
    qc.deviations.forEach(d => {
      const div = document.createElement('div');
      div.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;';
      div.innerHTML = `<div style="display:flex;align-items:center;gap:12px;"></div><button class="btn btn-sm btn-danger" type="button">✕</button>`;
      const left = div.firstChild;
      if (d.photoDataUrl) {
        const img = document.createElement('img');
        img.src = d.photoDataUrl;
        img.style.cssText = 'width:64px;height:48px;object-fit:cover;border-radius:4px;cursor:pointer;';
        img.onclick = () => openImagePreview(d.photoDataUrl, 'QK-Abweichung');
        left.appendChild(img);
      }
      const txt = document.createElement('div');
      txt.innerHTML = `<strong>${escapeHtml(d.description)}</strong><div style="font-size:11px;color:var(--text-dim);">${formatDateDE(d.createdAt)}</div>`;
      left.appendChild(txt);
      div.querySelector('button').onclick = () => this.removeQCDeviation(order.id, d.id);
      devList.appendChild(div);
    });

    document.getElementById('btn-add-qc-dev').onclick = () => this.addQCDeviation(order.id);
    document.getElementById('qc-inspector').onchange = (e) => this.updateNestedField(order.id, 'qc.inspector', e.target.value);
    document.getElementById('qc-approver').onchange = (e) => this.updateNestedField(order.id, 'qc.finalApprover', e.target.value);
    document.getElementById('btn-qc-pass').onclick = () => this.setQCStatus(order.id, 'Qualitätskontrolle bestanden');
    document.getElementById('btn-qc-rework').onclick = () => this.setQCStatus(order.id, 'Nacharbeit erforderlich');
    document.getElementById('btn-qc-repeat').onclick = () => this.setQCStatus(order.id, 'Qualitätskontrolle wiederholen');
  },

  async addQCDeviation(orderId) {
    const o = this.orders.find(x => x.id === orderId);
    const desc = document.getElementById('qc-dev-desc').value.trim();
    if (!desc) { showToast('Bitte Beschreibung der Abweichung eingeben.', 'error'); return; }
    const file = document.getElementById('qc-dev-file').files?.[0];
    const photoDataUrl = file ? await compressImageFile(file) : '';
    o.qc.deviations.push({ id: uid('dev'), description: desc, photoDataUrl, createdAt: new Date().toISOString() });
    await this.saveOrder(o);
    this.renderCurrentView();
  },

  async removeQCDeviation(orderId, devId) {
    const o = this.orders.find(x => x.id === orderId);
    o.qc.deviations = o.qc.deviations.filter(d => d.id !== devId);
    await this.saveOrder(o);
    this.renderCurrentView();
  },

  async setQCStatus(orderId, status) {
    const o = this.orders.find(x => x.id === orderId);
    if (status === 'Qualitätskontrolle bestanden') {
      const allDone = Object.values(o.qc.checks).every(Boolean);
      if (!allDone) {
        showToast('Alle Pflichtpunkte (A–E) müssen geprüft sein, bevor die QK bestanden werden kann!', 'error');
        return;
      }
      o.qc.completedAt = new Date().toISOString();
      o.status = 'Abholbereit';
    } else if (status === 'Nacharbeit erforderlich') {
      o.status = 'In Bearbeitung';
      await StorageService.put('tasks', {
        id: uid('tsk'),
        orderId: o.id,
        orderNumber: o.orderNumber,
        title: `QK-Nacharbeit erforderlich (${o.vehicle.D1} ${o.vehicle.D3})`,
        done: false,
        createdAt: new Date().toISOString()
      });
      showToast('Aufgabe für erforderliche Nacharbeit automatisch erstellt!', 'info');
    } else {
      o.status = 'Qualitätskontrolle';
    }
    o.qc.status = status;
    await this.saveOrder(o);
    this.renderCurrentView();
  },

  async completeHandover(orderId) {
    const o = this.orders.find(x => x.id === orderId);
    if (o.qc.status !== 'Qualitätskontrolle bestanden') {
      showToast('Übergabe blockiert: Qualitätskontrolle wurde noch nicht bestanden.', 'error');
      return;
    }
    if (!o.handover.date) o.handover.date = todayISO();
    if (!o.handover.time) o.handover.time = nowTimeHHMM();
    o.status = 'Übergeben';
    await this.saveOrder(o);
    this.renderCurrentView();
  },

  async updateNestedField(orderId, path, val, rerender = false) {
    const o = this.orders.find(x => x.id === orderId);
    const parts = path.split('.');
    let cur = o;
    for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
    cur[parts[parts.length - 1]] = val;
    await this.saveOrder(o, true);
    if (rerender) this.renderCurrentView();
  },

    bSync.onclick = () => this.syncSingleOrderCalendar(order.id);
    wrap.appendChild(bSync);

    const bAvail = document.createElement('button');
    bAvail.className = 'btn';
    bAvail.textContent = '🕒 Verfügbarkeit prüfen';
    bAvail.onclick = () => this.checkOrderAvailability(order.id);
    wrap.appendChild(bAvail);

    if (cal.googleEventLink && /^https?:\/\//i.test(cal.googleEventLink)) {
      const a = document.createElement('a');
      a.className = 'btn btn-success';
      a.href = cal.googleEventLink;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '↗ Im Google Kalender öffnen';
      wrap.appendChild(a);
    }
    if (cal.googleEventId) {
      const bDel = document.createElement('button');
      bDel.className = 'btn btn-danger';
      bDel.textContent = '🗑 Kalendereintrag löschen';
      bDel.onclick = () => this.deleteSingleOrderCalendar(order.id);
      wrap.appendChild(bDel);
    }
  },

  exportPDF(orderId, variant) {
    const order = this.orders.find(o => o.id === orderId);
    if (!order) return;
    try {
      PDFExportService.generate(order, variant);
      showToast('PDF erfolgreich erstellt und heruntergeladen.', 'success');
    } catch (err) {
      showToast(`PDF-Fehler: ${err.message}`, 'error');
    }
  },

  async connectGoogleCalendar() {
    try {
      await GoogleCalendarService.connect();
      showToast('Erfolgreich mit Google Kalender verbunden!', 'success');
      this.renderCurrentView();
    } catch (err) {
      showToast(err.message, 'error');
    }
  },

  async syncSingleOrderCalendar(orderId) {
    const order = this.orders.find(o => o.id === orderId);
    try {
      const res = await GoogleCalendarService.syncOrderEvent(order);
      await this.reloadData();
      if (res.synced) showToast('Google Kalendereintrag synchronisiert.', 'success');
      else showToast('Nicht verbunden – Auftrag als synchronisierungs-ausstehend markiert.', 'info');
      this.renderCurrentView();
    } catch (err) {
      await this.reloadData();
      showToast(`Kalender-Fehler: ${err.message}`, 'error');
      this.renderCurrentView();
    }
  },

  async checkOrderAvailability(orderId) {
    const order = this.orders.find(o => o.id === orderId);
    const out = document.getElementById('cal-avail-result');
    try {
      const startIso = toLocalOffsetISO(order.job.startDate, order.job.startTime || '09:00');
      const endIso = toLocalOffsetISO(order.job.plannedCompletion || order.job.startDate, order.job.endTime || '17:00');
      const busy = await GoogleCalendarService.checkAvailability(startIso, endIso);
      if (busy.length === 0) {
        out.innerHTML = '<div class="alert alert-success">✅ Der gewählte Zeitraum ist im ausgewählten Kalender frei!</div>';
      } else {
        out.innerHTML = `<div class="alert alert-warn">⚠️ Es gibt ${busy.length} belegte(n) Zeitraum/Zeiträume:<br>${busy.map(b => `${formatDateDE(b.start)} ${formatTimeDE(b.start)} – ${formatTimeDE(b.end)}`).join('<br>')}</div>`;
      }
    } catch (err) {
      out.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
    }
  },

  deleteSingleOrderCalendar(orderId) {
    const order = this.orders.find(o => o.id === orderId);
    confirmModal('Kalendereintrag löschen?', `Soll der verknüpfte Google-Kalendereintrag für ${order.orderNumber} gelöscht werden?`, async () => {
      try {
        await GoogleCalendarService.deleteOrderEvent(order);
        await this.reloadData();
        showToast('Kalendereintrag gelöscht.', 'success');
        this.renderCurrentView();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  },

  async deleteOrder(orderId) {
    const order = this.orders.find(o => o.id === orderId);
    if (!order) return;
    confirmModal('Auftrag endgültig löschen?', `Möchten Sie den Auftrag ${order.orderNumber} wirklich unwiderruflich löschen?`, async () => {
      if (order.calendar?.googleEventId && GoogleCalendarService.isConnected()) {
        try { await GoogleCalendarService.deleteOrderEvent(order); } catch {}
      }
      await StorageService.remove('orders', orderId);
      await this.reloadData();
      showToast(`Auftrag ${order.orderNumber} gelöscht.`, 'info');
      this.renderCurrentView();
    });
  },

  renderTasksAndCalendar(root) {
    const pendingSync = this.orders.filter(o => o.calendar?.syncStatus === 'pending' || o.calendar?.syncStatus === 'error');

    root.innerHTML = `
      <div class="grid grid-2">
        <div class="card accent-bar-red">
          <div class="card-header"><div class="card-title">✅ Aufgabenliste (${this.tasks.filter(t => !t.done).length} offen)</div></div>
          <div style="display:flex;gap:8px;margin-bottom:14px;">
            <input id="new-task-title" placeholder="Neue Aufgabe eingeben..." />
            <button class="btn btn-primary" id="btn-add-task" type="button">Hinzufügen</button>
          </div>
          <div id="tasks-list-wrap"></div>
        </div>

        <div class="card accent-bar-blue">
          <div class="card-header">
            <div class="card-title">📅 Google Kalender Status</div>
            <div id="tasks-gcal-badge"></div>
          </div>
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">
            Ausstehende oder fehlerhafte Kalendersynchronisierungen: <strong>${pendingSync.length}</strong>
          </p>
          <div id="tasks-pending-wrap"></div>
        </div>
      </div>
    `;

    document.getElementById('btn-add-task').onclick = () => this.addManualTask();
    const listWrap = document.getElementById('tasks-list-wrap');
    if (this.tasks.length === 0) {
      listWrap.innerHTML = '<p style="color:var(--text-dim);">Keine Aufgaben vorhanden.</p>';
    } else {
      this.tasks.forEach(t => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:10px;';
        row.innerHTML = `
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;${t.done ? 'text-decoration:line-through;color:var(--text-dim);' : ''}">
            <input type="checkbox" style="width:16px;height:16px;" ${t.done ? 'checked' : ''} />
            <span>${escapeHtml(t.title)}</span>
          </label>
          <div style="display:flex;gap:6px;align-items:center;"></div>
        `;
        row.querySelector('input').onchange = () => this.toggleTask(t.id);
        const right = row.lastElementChild;
        if (t.orderId) {
          const bOrd = document.createElement('button');
          bOrd.className = 'btn btn-sm';
          bOrd.textContent = t.orderNumber;
          bOrd.onclick = () => this.openOrder(t.orderId);
          right.appendChild(bOrd);
        }
        const bDel = document.createElement('button');
        bDel.className = 'btn btn-sm btn-danger';
        bDel.textContent = '✕';
        bDel.onclick = () => this.deleteTask(t.id);
        right.appendChild(bDel);
        listWrap.appendChild(row);
      });
    }

    const gcalBadge = document.getElementById('tasks-gcal-badge');
    if (!GoogleCalendarService.isConnected()) {
      const bConn = document.createElement('button');
      bConn.className = 'btn btn-blue btn-sm';
      bConn.textContent = 'Verbinden';
      bConn.onclick = () => this.connectGoogleCalendar();
      gcalBadge.appendChild(bConn);
    } else {
      gcalBadge.innerHTML = '<span class="badge st-Abholbereit">Verbunden</span>';
    }

    const pendWrap = document.getElementById('tasks-pending-wrap');
    if (pendingSync.length > 0) {
      const bSyncAll = document.createElement('button');
      bSyncAll.className = 'btn btn-primary';
      bSyncAll.style.marginBottom = '12px';
      bSyncAll.textContent = '🔄 Alle ausstehenden Termine synchronisieren';
      bSyncAll.onclick = () => this.syncAllPendingCalendars();
      pendWrap.appendChild(bSyncAll);
      pendingSync.forEach(o => {
        const d = document.createElement('div');
        d.style.cssText = 'padding:6px 0;border-bottom:1px solid var(--border);';
        d.textContent = `${o.orderNumber} – ${o.vehicle.D1} (${o.calendar.syncStatus})`;
        pendWrap.appendChild(d);
      });
    } else {
      pendWrap.innerHTML = '<p style="color:var(--success);">Alle Termine sind aktuell.</p>';
    }
  },

  async addManualTask() {
    const title = document.getElementById('new-task-title').value.trim();
    if (!title) return;
    await StorageService.put('tasks', { id: uid('tsk'), title, done: false, createdAt: new Date().toISOString() });
    await this.reloadData();
    this.renderCurrentView();
  },

  async toggleTask(id) {
    const t = this.tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    await StorageService.put('tasks', t);
    await this.reloadData();
    this.renderCurrentView();
  },

  async deleteTask(id) {
    await StorageService.remove('tasks', id);
    await this.reloadData();
    this.renderCurrentView();
  },

  async syncAllPendingCalendars() {
    if (!GoogleCalendarService.isConnected()) {
      await this.connectGoogleCalendar();
    }
    const pending = this.orders.filter(o => o.calendar?.syncStatus === 'pending' || o.calendar?.syncStatus === 'error');
    for (const o of pending) {
      try { await GoogleCalendarService.syncOrderEvent(o); } catch (e) { showToast(e.message, 'error'); }
    }
    await this.reloadData();
    this.renderCurrentView();
    showToast('Ausstehende Kalendertermine synchronisiert.', 'success');
  },

  renderSettings(root) {
    const s = StorageService.getSettings();
    const owner = this.isOwner();

    if (!owner) {
      root.innerHTML = `<div class="alert alert-danger">🔒 Zugriff verweigert: Einstellungen, API-Keys, Mitarbeiterverwaltung und Backups sind nur in der Rolle „Inhaber“ zugänglich.</div>`;
      return;
    }

    root.innerHTML = `
      <div class="grid grid-2">
        <div class="card accent-bar-red">
          <div class="card-header"><div class="card-title">🎨 Unternehmenslogo &amp; Vorgaben</div></div>
          <div class="form-group">
            <label class="form-label">Unternehmenslogo hochladen (PNG/JPG – wird im Header &amp; PDF verwendet)</label>
            <input type="file" id="logo-upload-input" accept="image/png,image/jpeg,image/webp" />
          </div>
          <div class="grid grid-2">
            <div class="form-group"><label class="form-label">Standard-MwSt. (%)</label><input type="number" id="set-vat" value="${escapeAttr(s.defaultVat)}" /></div>
            <div class="form-group"><label class="form-label">Kalk. Stundenkostensatz (€/h)</label><input type="number" id="set-rate" value="${escapeAttr(s.hourlyRate)}" /></div>
          </div>
          <button class="btn btn-primary" id="btn-save-base" type="button">💾 Vorgaben speichern</button>
        </div>

        <div class="card accent-bar-blue">
          <div class="card-header"><div class="card-title">🔑 API- &amp; Google Kalender Konfiguration</div></div>
          <div class="alert alert-info" style="font-size:12px;">
            API-Schlüssel werden ausschließlich lokal in Ihrem Browser (<code>localStorage</code>) gespeichert und nicht in den HTML-Code geschrieben.
          </div>
          <div class="form-group">
            <label class="form-label">Gemini API-Key (für Fahrzeugschein-OCR)</label>
            <input type="password" id="set-gemini-key" value="${escapeAttr(s.geminiApiKey)}" placeholder="AIza..." />
          </div>
          <div class="form-group">
            <label class="form-label">Google OAuth 2.0 Client-ID (für Google Kalender)</label>
            <input type="text" id="set-gcal-client" value="${escapeAttr(s.googleClientId)}" placeholder="123456789-xxxx.apps.googleusercontent.com" />
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
            <button class="btn btn-primary" id="btn-save-api" type="button">💾 API-Daten speichern</button>
            <button class="btn btn-blue" id="btn-conn-gcal" type="button">🔗 Mit Google Kalender verbinden</button>
          </div>
          <div id="gcal-list-wrap"></div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <div class="card-header"><div class="card-title">👥 Mitarbeiterverwaltung</div></div>
          <div style="display:flex;gap:8px;margin-bottom:12px;">
            <input id="new-emp-name" placeholder="Name des Mitarbeiters" />
            <select id="new-emp-role" style="max-width:150px;"><option value="Mitarbeiter">Mitarbeiter</option><option value="Inhaber">Inhaber</option></select>
            <button class="btn btn-blue" id="btn-add-emp" type="button">➕ Hinzufügen</button>
          </div>
          <div id="emp-list-wrap"></div>
        </div>

        <div class="card">
          <div class="card-header"><div class="card-title">💾 Datensicherung (JSON Export / Import)</div></div>
          <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">
            Alle Aufträge inkl. Fotos, Unterschriften und Aufgaben als JSON-Datei sichern oder wiederherstellen.
          </p>
          <label class="check-item" style="margin-bottom:12px;">
            <input type="checkbox" id="chk-backup-secrets" />
            <span>API-Key im Backup mit exportieren (nur auf sicherem Gerät aktivieren)</span>
          </label>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <button class="btn btn-success" id="btn-dl-backup" type="button">⬇ JSON-Backup herunterladen</button>
            <input type="file" id="json-import-file" accept="application/json" style="max-width:240px;" />
            <button class="btn btn-warning" id="btn-restore-backup" type="button">⬆ Backup wiederherstellen</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('logo-upload-input').onchange = (e) => this.uploadLogo(e.target.files[0]);
    document.getElementById('btn-save-base').onclick = () => this.saveBaseSettings();
    document.getElementById('btn-save-api').onclick = () => this.saveApiSettings();
    document.getElementById('btn-conn-gcal').onclick = () => this.connectGoogleCalendar();
    document.getElementById('btn-add-emp').onclick = () => this.addEmployee();
    document.getElementById('btn-dl-backup').onclick = () => this.downloadBackup();
    document.getElementById('btn-restore-backup').onclick = () => this.restoreBackup();

    if (GoogleCalendarService.calendars.length > 0) {
      const gWrap = document.getElementById('gcal-list-wrap');
      gWrap.innerHTML = `<div class="form-group"><label class="form-label">Ziel-Kalender auswählen</label><select id="sel-gcal"></select></div>`;
      const sel = document.getElementById('sel-gcal');
      GoogleCalendarService.calendars.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.summary;
        opt.selected = s.selectedCalendarId === c.id;
        sel.appendChild(opt);
      });
      sel.onchange = () => this.selectCalendar(sel.value);
    }

    const empWrap = document.getElementById('emp-list-wrap');
    s.employees.forEach((e, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);';
      row.innerHTML = `<span><strong>${escapeHtml(e.name)}</strong> <span class="badge st-Angebot">${escapeHtml(e.role)}</span></span>`;
      if (s.employees.length > 1) {
        const b = document.createElement('button');
        b.className = 'btn btn-sm btn-danger';
        b.textContent = '✕';
        b.onclick = () => this.removeEmployee(i);
        row.appendChild(b);
      }
      empWrap.appendChild(row);
    });
  },

  async uploadLogo(file) {
    if (!file) return;
    const s = StorageService.getSettings();
    s.logoDataUrl = await compressImageFile(file, 600, 0.9);
    StorageService.saveSettings(s);
    this.applySettingsToUI();
    showToast('Unternehmenslogo gespeichert!', 'success');
  },

  saveBaseSettings() {
    const s = StorageService.getSettings();
    s.defaultVat = parseFloat(document.getElementById('set-vat').value) || 19;
    s.hourlyRate = parseFloat(document.getElementById('set-rate').value) || 85;
    StorageService.saveSettings(s);
    showToast('Vorgaben gespeichert.', 'success');
  },

  saveApiSettings() {
    const s = StorageService.getSettings();
    s.geminiApiKey = document.getElementById('set-gemini-key').value.trim();
    s.googleClientId = document.getElementById('set-gcal-client').value.trim();
    StorageService.saveSettings(s);
    showToast('API-Konfiguration gespeichert.', 'success');
  },

  selectCalendar(calId) {
    const s = StorageService.getSettings();
    s.selectedCalendarId = calId;
    StorageService.saveSettings(s);
    showToast('Kalender ausgewählt.', 'success');
  },

  addEmployee() {
    const name = document.getElementById('new-emp-name').value.trim();
    const role = document.getElementById('new-emp-role').value;
    if (!name) return;
    const s = StorageService.getSettings();
    s.employees.push({ name, role });
    StorageService.saveSettings(s);
    this.applySettingsToUI();
    this.renderCurrentView();
  },

  removeEmployee(idx) {
    const s = StorageService.getSettings();
    s.employees.splice(idx, 1);
    StorageService.saveSettings(s);
    this.applySettingsToUI();
    this.renderCurrentView();
  },

  async downloadBackup() {
    const includeSecrets = !!document.getElementById('chk-backup-secrets')?.checked;
    const json = await StorageService.exportJSON(includeSecrets);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Favela_Industries_Backup_${todayISO()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Backup heruntergeladen.', 'success');
  },

  async restoreBackup() {
    const file = document.getElementById('json-import-file').files?.[0];
    if (!file) { showToast('Bitte eine JSON-Backup-Datei auswählen.', 'error'); return; }
    confirmModal('Backup einspielen?', 'Achtung: Aktuelle lokale Aufträge werden durch das Backup ersetzt. Fortfahren?', async () => {
      try {
        const text = await file.text();
        await StorageService.importJSON(text);
        await this.reloadData();
        this.applySettingsToUI();
        showToast('Backup erfolgreich wiederhergestellt!', 'success');
        this.navigate('dashboard');
      } catch (err) {
        showToast(`Import-Fehler: ${err.message}`, 'error');
      }
    });
  },

  async loadDemoOrder() {
    const o = createEmptyOrder(this.generateNextOrderNumber());
    o.status = 'In Bearbeitung';
    o.customer = { firstName: 'Max', lastName: 'Mustermann', company: 'Muster Performance GmbH', street: 'Motorsportring 12', zip: '80331', city: 'München', phone: '0170 1234567', email: 'max@muster.de' };
    o.vehicle = { B: '14.03.2024', D1: 'BMW', D2: 'G82', D3: 'M4 Competition', E: 'WBS41AZ090CM12345', hsn: '7909', tsn: 'ACU', P1: '2993', P2: '375', P3: 'Benzin', J: 'M1', K: 'e1*2007/46*2100', color: 'Saphirschwarz', plate: 'M-FI 2026' };
    o.vehicleDataVerified = true;
    o.job = { ...o.job, wrapType: 'Vollfolierung', vehicleArea: 'Komplett inkl. Türfalze', desiredColor: 'Satin Dark Grey', filmBrand: '3M', filmName: '2080 Series', filmCode: 'S261', glossLevel: 'Seidenmatt / Satin', surfaceFinish: 'Glatt', startDate: todayISO(), plannedCompletion: todayISO(), plannedHours: 24, netPrice: 3200, vatRate: 19, grossPrice: 3808, scopeIncluded: 'Vollfolierung inkl. Demontage Stoßfänger & Türgriffe', scopeExcluded: 'Felgen & Bremssättel' };
    o.materials.push({ id: uid('m'), category: 'Wrappingfolie', brand: '3M', product: '2080 S261 Satin Dark Grey', sku: '3M-S261', widthMm: 1520, lengthM: 22, areaM2: 33.44, unit: 'm', qty: 22, unitCost: 29.5, totalCost: 649, supplier: 'FolienCenter24', notes: '1 Rolle angebrochen' });
    o.timeLogs.push({ id: uid('t'), employee: 'Inhaber (Chef)', date: todayISO(), startTime: '09:00', endTime: '13:30', pauseMinutes: 30, effectiveHours: 4.0, activity: 'Demontage', notes: 'Stoßfänger & Spiegel demontiert' });
    await this.saveOrder(o);
    this.renderCurrentView();
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
